services:
  music-separator:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Кэш моделей PyTorch, чтобы веса сохранялись между перезапусками
      - torch_cache:/root/.cache/torch
    # Для GPU (если доступен) раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  torch_cache: